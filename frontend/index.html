<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="humanAI — AI-powered conversations" />
    <title>humanAI — AI Assistant</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310a37f' stroke-width='1.5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts: DM Sans + DM Mono (matches main.css --font-sans / --font-mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /*
        Critical pre-render styles only.
        Full theme tokens live in main.css.
        This block prevents a flash of unstyled content (FOUC)
        before React + main.css mount.
      */

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
        /* Default to dark so the background shows immediately */
        background: #1e1f25;
        color-scheme: dark light;
      }

      body {
        font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
        background: #1e1f25;       /* --bg-app dark */
        color: #f0f0f4;            /* --text-primary dark */
        height: 100dvh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Light-theme pre-render override */
      html[data-theme="light"] body {
        background: #f5f5f7;       /* --bg-app light */
        color: #1a1a2e;            /* --text-primary light */
      }

      #root {
        height: 100dvh;
        display: flex;
      }

      /* Loading screen — shown until React hydrates */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1e1f25;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      html[data-theme="light"] #app-loader {
        background: #f5f5f7;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Brand logo mark */
      .loader-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #10a37f;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(16, 163, 127, 0.35);
      }
      .loader-icon svg {
        width: 24px;
        height: 24px;
        color: #fff;
        stroke: #fff;
        fill: none;
        stroke-width: 1.5;
      }

      /* Spinner — matches .spinner in main.css */
      .loader-spinner {
        width: 20px;
        height: 20px;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        border-top-color: #10a37f;
        border-radius: 9999px;
        animation: spin 0.65s linear infinite;
      }
      html[data-theme="light"] .loader-spinner {
        border-color: rgba(0, 0, 0, 0.10);
        border-top-color: #10a37f;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* Scrollbar — matches main.css */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
      html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); }
      html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }

      /* Selection highlight — matches main.css ::selection */
      ::selection { background: rgba(16, 163, 127, 0.25); }
    </style>
  </head>

  <body>

    <!-- Loading screen (hidden by JS once React mounts) -->
    <div id="app-loader" aria-hidden="true">
      <div class="loader-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="loader-spinner"></div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Hide loader once React has painted -->
    <script>
      (function () {
        // Persist theme choice across reloads before React reads it
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (_) {}

        // Remove the loader after first React render
        window.__hideLoader = function () {
          var el = document.getElementById("app-loader");
          if (!el) return;
          el.classList.add("hidden");
          setTimeout(function () { el.remove(); }, 300);
        };
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
